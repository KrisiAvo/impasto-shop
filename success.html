<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order confirmed — Impasto</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#efe8d8;color:#221d15;font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{max-width:520px;padding:60px 40px;text-align:center}
  .stamp{font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;font-size:12px;color:#7a5726;border:1px solid #7a5726;display:inline-block;padding:5px 12px;border-radius:2px;margin-bottom:22px}
  h1{font-family:'Fraunces',serif;font-size:30px;margin:0 0 14px}
  p{color:#5c5647;font-size:15px;line-height:1.6}
  a.btn{display:inline-block;margin-top:26px;padding:13px 26px;background:#221d15;color:#fbf8f0;text-decoration:none;border-radius:2px;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="stamp">PAYMENT CONFIRMED</div>
    <h1>Thank you for your order.</h1>
    <p>Your receipt is on its way from Stripe, and your wallpaper files are being emailed to you separately — they usually land within a minute or two. Check your spam folder if you don't see them.</p>
    <a class="btn" href="/index.html#/catalog">Continue browsing</a>
  </div>
</body>
</html>
